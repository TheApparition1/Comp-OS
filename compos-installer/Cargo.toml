[package]
name = "compos-installer"
version = "0.1.0"
description = "CompOS Installer"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "compos_installer"
crate-type = ["cdylib"]

[[bin]]
name = "compos-installer"
path = "src/main.rs"