[package]
name = "compos-installer"
version = "0.1.0"
description = "CompOS Installer - Modern UI with real system installation"
authors = ["CompOS Team"]
license = "MIT"
repository = "https://github.com/compos/installer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
